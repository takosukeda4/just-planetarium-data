name: update-data
on:
  schedule:
    - cron: "20 18 * * *"       # 毎日 03:20 JST: 情報パネル + 画像の枠 + 情報ボード v2（board.txt・cards/）を入れ替える（雨の定時は 11/6 にやめた）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install pillow segno==1.6.6
          pip install zxing-cpp==3.1.1 || echo "zxing-cpp が入らない: QR の読み直しを飛ばす"
      - name: build
        run: |
          mkdir -p out
          python scripts/build_info.py out
          test -s out/qr.png && grep -q '^#qr' out/info.txt
      - name: board (情報ボード v2: board.txt・cards/・board.json。失敗しても info.txt などは上げる)
        env:
          BOARD_MINUTES: "20"
        run: |
          python scripts/build_board.py out || echo "::warning::build_board.py が失敗した（前の board.txt と cards/ を残す）"
          test -s out/board.txt && grep -q '^#items' out/board.txt || rm -f out/board.txt out/board.json
      - name: publish to gh-pages (keep other files, single commit)
        run: |
          # pub は別のリポジトリなので --global にする（1 回目の実行で「Author identity unknown」になった）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          else
            mkdir pub && cd pub && git init -b gh-pages && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && cd ..
          fi
          if [ -s out/board.txt ]; then rm -rf pub/cards; fi   # 画像は毎日入れ替わる（無い番号は置かない）
          cp -r out/. pub/
          rm -f pub/rain.txt pub/rain.json   # 自動の雨は 11/6 にやめた（ワールドは読まない）
          touch pub/.nojekyll
          cd pub
          git add -A
          git commit --amend -m "data $(date -u +%FT%TZ)" 2>/dev/null || git commit -m "data $(date -u +%FT%TZ)"
          git push --force origin gh-pages
