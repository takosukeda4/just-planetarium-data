name: update-data
on:
  schedule:
    - cron: "7,37 * * * *"      # 30 分ごと: 雨（GitHub の定時実行は数分〜十数分遅れることがある）
    - cron: "20 18 * * *"       # 毎日 03:20 JST: 情報パネル + 画像の枠を入れ替える
  workflow_dispatch:
    inputs:
      what:
        description: "rain / info / both"
        default: "both"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: choose
        id: c
        run: |
          if [ "${{ github.event.schedule }}" = "20 18 * * *" ]; then echo "what=both" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "what=${{ github.event.inputs.what }}" >> $GITHUB_OUTPUT
          else echo "what=rain" >> $GITHUB_OUTPUT; fi
      - name: build
        run: |
          mkdir -p out
          W="${{ steps.c.outputs.what }}"
          if [ "$W" = "rain" ] || [ "$W" = "both" ]; then python scripts/build_rain.py out; fi
          if [ "$W" = "info" ] || [ "$W" = "both" ]; then python scripts/build_info.py out; fi
      - name: publish to gh-pages (keep other files, single commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          else
            mkdir pub && cd pub && git init -b gh-pages && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && cd ..
          fi
          cp -r out/. pub/
          touch pub/.nojekyll
          cd pub
          git add -A
          git commit --amend -m "data $(date -u +%FT%TZ)" 2>/dev/null || git commit -m "data $(date -u +%FT%TZ)"
          git push --force origin gh-pages
